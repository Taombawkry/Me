[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "output"
  
[build.environment]
  # The build itself is Python; NODE_VERSION just pins Netlify's toolchain
  # so deploys don't drift when they move the default.
  NODE_VERSION = "24"
  PYTHON_VERSION = "3.13"
  NETLIFY = "true"
  PIP_NO_CACHE_DIR = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "python build.py && python -m http.server -d output"
  targetPort = 8000
  port = 8000
  publish = "output"
  autoLaunch = true